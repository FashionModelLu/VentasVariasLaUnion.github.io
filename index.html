  }

  .feria-sub { font-size: 12px; font-weight: 700; color: #993356; }

  .wa-btn {

    padding: 11px; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 900; color: #fff;

  }

  .cat-nav {
    display: flex; gap: 6px; padding: 10px 14px;
    overflow-x: auto; background: #3B6FAF;
  }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: #2D5A96; border: 1.5px solid #5B8EC5;

  .main { padding: 10px 12px 80px; }

  .sec-head {

  .lbl-sanrio   { color: #FFB8D9; }
  .lbl-llaveros { color: #B8F5D8; }
  .sec-count { font-size: 11px; color: #7AAAD8; font-weight: 700; }

  .grid {
    display: grid;

  .card {
    background: #EEF5FF; border: 1.5px solid #B8D4F5;

  .card-img {
    background: #fff; height: 90px;

    padding: 6px; position: relative;

  .cat-dot {

  .dot-s { background: #FFB8D9; }

  .card-body { padding: 6px 7px 8px; }

    display: block; width: 100%; margin-top: 5px;

    padding: 4px 0; font-family: inherit;
    font-size: 10px; font-weight: 800; color: #1E3F6E; cursor: pointer;
    transition: background 0.12s;
  }
  .add-btn:hover { background: #FFB8D9; color: #6B0020; }

  .divider { height: 1px; background: #4A7FC0; margin-bottom: 14px; }

  .cart-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.35); z-index: 40;
  }
  .cart-overlay.open { display: block; }

  .cart-drawer {
    position: fixed; bottom: -100%; left: 0; right: 0;
    max-height: 75vh; background: #EEF5FF;
    border-radius: 18px 18px 0 0;
    z-index: 50; display: flex; flex-direction: column;
    transition: bottom 0.28s cubic-bezier(.4,0,.2,1);
    font-family: 'Nunito', sans-serif;
  }
  .cart-drawer.open { bottom: 0; }

  .drawer-handle {
    width: 36px; height: 4px; background: #B8D4F5;
    border-radius: 99px; margin: 10px auto 0;
  }
  .drawer-head {
    padding: 10px 16px 8px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #B8D4F5;
  }
  .drawer-title { font-size: 14px; font-weight: 900; color: #1E3F6E; }

  .drawer-items { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .cart-empty-msg { text-align: center; padding: 24px 0; font-size: 13px; color: #7AAAD8; font-weight: 700; }
  .cart-row {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #C5DCEF;
  }
  .cart-thumb { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 8px; flex-shrink: 0; }

  .cart-rname { font-size: 11px; font-weight: 800; color: #1E3F6E; }

  .drawer-foot { padding: 10px 14px 16px; border-top: 1px solid #B8D4F5; }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

    font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit;

  .flash-msg {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1E3F6E; color: #B8D4F5;
    border-radius: 99px; padding: 8px 18px;
    font-size: 12px; font-weight: 800; font-family: 'Nunito', sans-serif;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100; white-space: nowrap;
  }
  .flash-msg.show { opacity: 1; }
</style>

<script>

  {id:29, name:"Toy Story",            cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712317/ToyStory_tibh56.png"},

  {id:31, name:"Zootopia",             cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712320/Zootopia_a05qfe.png"},
  {id:32, name:"Goku",                 cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712320/Gokus_pohx17.png"},
  {id:33, name:"Mundial",              cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712313/Mundial_nk20ze.png"},
  {id:34, name:"Camisetas",            cat:"Llaveros", price:5990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712325/Poleras_zwd7uv.png"},
  {id:35, name:"Stitch",               cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712637/Gemini_Generated_Image_blsurcblsurcblsu_b6eaqw.png"},
  {id:36, name:"Mickey Mouse",         cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712691/Mickyes_i4djfc.png"},
  {id:37, name:"Spiderman Miles",      cat:"Llaveros", price:4990,  img:"https://res.cloudinary.com/dy1ibwcdn/image/upload/v1781712735/Spidermans_hcp3k4.png"},
];

const secs = [
  {cat:'Peluches', lblCls:'lbl-peluches', dot:'dot-p', label:'Peluches'},
  {cat:'Sanrio',   lblCls:'lbl-sanrio',   dot:'dot-s', label:'Colección Sanrio'},
  {cat:'Llaveros', lblCls:'lbl-llaveros', dot:'dot-l', label:'Llaveros'},
];

let cart = [];
let activeCat = 'all';
const fmt = n => '$' + n.toLocaleString('es-CL');

function mkCard(p, dot) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `
    <div class="card-img">
      <span class="cat-dot ${dot}"></span>
      <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.opacity='.1'"/>
    </div>
    <div class="card-body">
      <div class="card-name">${p.name}</div>
      <div class="card-price">${fmt(p.price)}</div>
      <button class="add-btn" onclick="addCart(${p.id})">+ Agregar</button>
    </div>`;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const show = activeCat === 'all' ? secs : secs.filter(s => s.cat === activeCat);
  show.forEach((s, i) => {
    const items = prods.filter(p => p.cat === s.cat);
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="sec-head"><span class="sec-label ${s.lblCls}">${s.label}</span><span class="sec-count">${items.length} productos</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(p => grid.appendChild(mkCard(p, s.dot)));
    wrap.appendChild(grid);
    if (i < show.length - 1 && activeCat === 'all') {
      const div = document.createElement('div');
      div.className = 'divider';
      wrap.appendChild(div);
    }
    main.appendChild(wrap);
  });
}

function setcat(btn, cat) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeCat = cat;
  render();
}

function addCart(id) {
  const p = prods.find(x => x.id === id);
  const ex = cart.find(x => x.id === id);
  if (ex) ex.qty++; else cart.push({...p, qty:1});
  updateCart();
  flash(p.name + ' agregado');
}

function removeCart(id) {
  cart = cart.filter(x => x.id !== id);
  updateCart();
}

function updateCart() {
  const count = cart.reduce((s,x) => s+x.qty, 0);
  document.getElementById('cart-count').textContent = count;
  const el = document.getElementById('drawer-items');
  const foot = document.getElementById('drawer-foot');
  if (!cart.length) {
    el.innerHTML = '<div class="cart-empty-msg">Tu carrito está vacío</div>';
    foot.style.display = 'none';
  } else {
    el.innerHTML = cart.map(x => `
      <div class="cart-row">
        <img class="cart-thumb" src="${x.img}" onerror="this.style.opacity='.1'"/>
        <div class="cart-info">
          <div class="cart-rname">${x.name}</div>
          <div class="cart-rprice">${fmt(x.price)} × ${x.qty}</div>
        </div>
        <button class="rm-btn" onclick="removeCart(${x.id})">×</button>
      </div>`).join('');
    document.getElementById('total-val').textContent = fmt(cart.reduce((s,x) => s+x.price*x.qty, 0));
    foot.style.display = 'block';
  }
}

function openCart() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeCart() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

let ft;
function flash(msg) {
  const f = document.getElementById('flash');
  f.textContent = msg; f.classList.add('show');
  clearTimeout(ft); ft = setTimeout(() => f.classList.remove('show'), 1600);
}

render();
</script>
