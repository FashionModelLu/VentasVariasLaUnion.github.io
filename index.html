];

const sections = [
  { cat:'Peluches', cls:'peluches', dot:'dot-peluches', label:'Peluches' },
  { cat:'Sanrio',   cls:'sanrio',   dot:'dot-sanrio',   label:'Colección Sanrio' },
  { cat:'Llaveros', cls:'llaveros', dot:'dot-llaveros', label:'Llaveros coleccionables' },
];

let cart = [];
let activeCat = 'all';

function fmt(n){ return '$' + n.toLocaleString('es-CL'); }

function card(p, dotCls) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `
    <div class="card-img">
      <span class="cat-dot ${dotCls}"></span>
      <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.opacity='.15'"/>
    </div>
    <div class="card-body">
      <div class="card-name">${p.name}</div>
      <div class="card-foot">
        <span class="card-price">${fmt(p.price)}</span>
        <button class="add-btn" onclick="addToCart(${p.id})">+ Agregar</button>
      </div>
    </div>`;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const toShow = activeCat === 'all' ? sections : sections.filter(s => s.cat === activeCat);
  toShow.forEach((sec, i) => {
    const prods = all.filter(p => p.cat === sec.cat);
    const block = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<span class="sec-label ${sec.cls}">${sec.label}</span><span class="sec-count">${prods.length} productos</span>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    prods.forEach(p => grid.appendChild(card(p, sec.dot)));
    block.appendChild(head);
    block.appendChild(grid);
    if (i < toShow.length - 1 && activeCat === 'all') {
      const div = document.createElement('div');
      div.className = 'divider';
      block.appendChild(div);
    }
    main.appendChild(block);
  });
}

function setcat(btn, cat) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeCat = cat;
  render();
}

function addToCart(id) {
  const p = all.find(x => x.id === id);
  const ex = cart.find(x => x.id === id);
  if (ex) ex.qty++;
  else cart.push({...p, qty: 1});
  updateCart();
  showFlash(p.name);
}

function removeFromCart(id) {
  cart = cart.filter(x => x.id !== id);
  updateCart();
}

function updateCart() {
  const count = cart.reduce((s,x) => s + x.qty, 0);
  document.getElementById('cart-count').textContent = count;
  const items = document.getElementById('drawer-items');
  const foot = document.getElementById('drawer-foot');
  if (!cart.length) {
    items.innerHTML = `<div class="cart-empty"><i class="ti ti-shopping-bag" style="font-size:36px;color:#9BBFDF;"></i><div class="cart-empty-txt">Tu carrito está vacío</div></div>`;
    foot.style.display = 'none';
  } else {
    items.innerHTML = cart.map(x => `
      <div class="cart-row">
        <img class="cart-thumb" src="${x.img}" alt="${x.name}" onerror="this.style.opacity='.15'"/>
        <div class="cart-info">
          <div class="cart-rname">${x.name}</div>
          <div class="cart-rprice">${fmt(x.price)} × ${x.qty}</div>
        </div>
        <button class="rm-btn" onclick="removeFromCart(${x.id})" aria-label="Quitar">×</button>
      </div>`).join('');
    document.getElementById('total-val').textContent = fmt(cart.reduce((s,x) => s + x.price * x.qty, 0));
    foot.style.display = 'block';
  }
}

function openCart() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeCart() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

let flashTimer;
function showFlash(name) {
  const f = document.getElementById('flash');
  f.textContent = name + ' agregado';
  f.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => f.classList.remove('show'), 1800);
}

render();
</script>
